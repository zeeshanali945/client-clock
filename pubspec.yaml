name: client_clock
description: Time zone companion that helps freelancers track client time and convert deadlines.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  timezone: '>=0.9.4 <1.0.0'
  flutter_timezone: ^3.0.1
  intl: '>=0.19.0 <1.0.0'
  shared_preferences: ^2.2.3
  flutter_local_notifications: '>=17.2.0 <18.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
